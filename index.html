<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票紀錄・個人證券損益紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --cover:#2E7FB8;
    --cover-dark:#1E5F8F;
    --brass:#C08A2E;
    --brass-light:#E0B14A;
    --paper:#FDF1CE;
    --paper-line:#EDD79A;
    --card:#FFFBEF;
    --ink:#2B2620;
    --ink-soft:#7A6E4E;
    --red:#B3261E;
    --green:#1E7145;
    --flat:#8A7F63;
    --border:#EDD9A0;
    --shadow: 0 10px 30px -12px rgba(43,38,32,0.28);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 10%, rgba(46,127,184,0.07), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(192,138,46,0.08), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:60px;
  }
  h1,h2,h3,h4{font-family:'Noto Serif TC', serif; margin:0;}
  .mono{font-family:'IBM Plex Mono','Noto Sans TC',monospace;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ===== Cover / header ===== */
  .cover{
    background:linear-gradient(160deg, var(--cover) 0%, var(--cover-dark) 100%);
    color:#EFE9D8;
    padding:22px 20px 0 20px;
    box-shadow: var(--shadow);
    position:relative;
  }
  .cover::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:6px;
    background:repeating-linear-gradient(90deg, var(--brass-light) 0 10px, transparent 10px 20px);
    opacity:.55;
  }
  .cover-inner{
    max-width:1040px; margin:0 auto;
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding-bottom:16px;
  }
  .cover-title{display:flex; align-items:center; gap:14px;}
  .cover-mark{
    width:46px; height:46px; border-radius:50%;
    background:var(--paper);
    border:2px solid rgba(255,255,255,0.6);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    box-shadow:0 3px 8px rgba(0,0,0,0.18);
    color:var(--red);
  }
  .cover-mark svg{ width:24px; height:24px; }
  .cover-title h1{font-size:22px; letter-spacing:1px; font-weight:700;}
  .cover-sub{margin:4px 0 0; font-size:12.5px; color:rgba(255,255,255,0.75); letter-spacing:.5px;}
  .cover-actions{display:flex; gap:8px; padding-bottom:4px; flex-wrap:wrap;}
  .btn-ghost-cover{
    background:rgba(239,233,216,0.08);
    border:1px solid rgba(239,233,216,0.35);
    color:#EFE9D8; padding:7px 12px; border-radius:20px; font-size:12.5px;
    transition:.15s;
  }
  .btn-ghost-cover:hover{background:rgba(239,233,216,0.18);}

  .tabs-account{
    max-width:1040px; margin:0 auto; display:flex; gap:6px; overflow-x:auto;
    padding:0 2px; scrollbar-width:thin;
  }
  .acc-tab{
    flex:0 0 auto;
    background:rgba(253,241,206,0.92);
    color:var(--ink);
    border:none; border-top:3px solid var(--brass);
    padding:9px 16px 8px; border-radius:8px 8px 0 0;
    font-size:13px; font-weight:500;
    display:flex; align-items:center; gap:6px;
    position:relative; top:1px;
    opacity:.72;
  }
  .acc-tab.active{opacity:1; background:var(--paper); font-weight:700; box-shadow:0 -2px 6px rgba(0,0,0,0.08);}
  .acc-tab .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .acc-tab-add{
    flex:0 0 auto; background:transparent; border:1px dashed rgba(239,233,216,0.5);
    color:#EFE9D8; padding:8px 14px; border-radius:8px 8px 0 0; font-size:13px; margin-bottom:1px;
  }

  /* ===== Page ===== */
  .page{max-width:1040px; margin:0 auto; padding:0 20px;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow: var(--shadow);
  }

  /* Dashboard */
  .dashboard{margin-top:18px;}
  .dash-card{padding:18px 20px 8px;}
  .dash-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:0; margin-top:6px;
  }
  .dash-item{
    padding:12px 14px 14px 0;
    border-right:1px dotted var(--paper-line);
  }
  .dash-item:last-child{border-right:none;}
  .dash-label{font-size:11.5px; color:var(--ink-soft); letter-spacing:.5px; display:flex; align-items:center; gap:5px;}
  .dash-value{font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; margin-top:4px;}
  .dash-sub{font-size:11px; color:var(--ink-soft); margin-top:2px; font-family:'IBM Plex Mono',monospace;}
  .pl-pos{color:var(--red);}
  .pl-neg{color:var(--green);}
  .pl-flat{color:var(--flat);}
  .charts-row{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; padding:6px 20px 20px;}
  @media (max-width:720px){.charts-row{grid-template-columns:1fr;}}
  .chart-box{background:var(--paper); border:1px solid var(--border); border-radius:8px; padding:12px; position:relative; height:220px;}
  .chart-box h4{font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
  .empty-note{font-size:12px; color:var(--ink-soft); text-align:center; padding-top:60px;}

  /* Section tabs */
  .tabs-section{
    display:flex; gap:4px; margin-top:22px; border-bottom:2px solid var(--border);
    overflow-x:auto;
  }
  .tabs-section button{
    background:transparent; border:none; padding:10px 16px; font-size:13.5px; font-weight:600;
    color:var(--ink-soft); border-radius:8px 8px 0 0; white-space:nowrap;
    border-bottom:2px solid transparent; margin-bottom:-2px;
  }
  .tabs-section button.active{color:var(--cover); border-bottom:2px solid var(--brass); background:var(--card);}

  .panel{padding:18px 0 40px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:12px;}
  .panel-head h3{font-size:16px;}
  .panel-tools{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

  .btn-stamp{
    background:var(--card); border:2px solid var(--red); color:var(--red);
    padding:8px 16px; border-radius:22px; font-weight:700; font-size:13px; letter-spacing:.5px;
    transition:.15s;
  }
  .btn-stamp:hover{background:var(--red); color:#fff;}
  .btn-stamp-loss{
    background:var(--card); border:2px solid var(--green); color:var(--green);
    padding:8px 16px; border-radius:22px; font-weight:700; font-size:13px; letter-spacing:.5px;
    transition:.15s;
  }
  .btn-stamp-loss:hover{background:var(--green); color:#fff;}
  .btn-secondary{background:var(--paper); border:1px solid var(--border); color:var(--ink); padding:8px 14px; border-radius:22px; font-size:13px;}
  .btn-secondary:hover{background:#EFE4C6;}
  .btn-danger{background:var(--red); color:#fff; border:none; padding:8px 16px; border-radius:22px; font-size:13px; font-weight:600;}
  .btn-text{background:none; border:none; color:var(--brass); font-size:12.5px; text-decoration:underline; padding:2px 4px;}
  .btn-icon{background:none; border:none; font-size:14px; padding:3px 6px; color:var(--ink-soft); border-radius:6px;}
  .btn-icon:hover{background:var(--paper);}
  select.input-sel, input.input-txt{
    border:1px solid var(--border); background:var(--paper); border-radius:6px; padding:7px 10px; font-size:13px; color:var(--ink);
  }

  /* Table (ledger style) */
  .ledger-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); background:var(--card);}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:640px;}
  thead th{
    text-align:left; font-weight:600; color:var(--ink-soft); font-size:11.5px; letter-spacing:.4px;
    padding:10px 12px; border-bottom:2px solid var(--border); background:var(--paper); white-space:nowrap;
  }
  tbody td{padding:10px 12px; border-bottom:1px dotted var(--paper-line); vertical-align:middle; white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(169,129,47,0.06);}
  td.num, th.num{text-align:right; font-family:'IBM Plex Mono',monospace;}
  .badge{display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; letter-spacing:.3px;}
  .badge-stock{background:#DCEBF5; color:var(--cover);}
  .badge-etf{background:#F3E7C9; color:#7A5C15;}
  .badge-buy{background:#FCE4E1; color:var(--red);}
  .badge-sell{background:#E1EFE6; color:var(--green);}
  .acc-chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-soft);}
  .acc-chip .dot{width:7px;height:7px;border-radius:50%;}

  .empty-state{
    text-align:center; padding:44px 20px; color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:30px; margin-bottom:8px; opacity:.6;}
  .empty-state p{font-size:13px; margin:4px 0 14px;}

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,18,14,0.5); backdrop-filter:blur(1px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;
    animation: fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal-card{
    background:var(--card); width:100%; max-width:480px; border-radius:12px; box-shadow:0 24px 60px rgba(0,0,0,0.35);
    max-height:88vh; overflow-y:auto; position:relative; animation: slideUp .18s ease;
  }
  @keyframes slideUp{from{transform:translateY(14px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-tear{
    height:10px; width:100%;
    background-image: radial-gradient(circle at 10px 0, transparent 5px, var(--card) 5.5px);
    background-size:20px 10px; background-repeat:repeat-x;
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:4px 20px 12px; border-bottom:1px dotted var(--paper-line);}
  .modal-head h3{font-size:16px;}
  .modal-close{background:none; border:none; font-size:16px; color:var(--ink-soft); padding:4px;}
  .modal-body{padding:16px 20px 20px;}
  .form-row{margin-bottom:12px;}
  .form-row label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .form-row input, .form-row select, .form-row textarea{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:7px; background:var(--paper); font-size:13.5px; color:var(--ink);
  }
  .form-row textarea{resize:vertical; min-height:50px;}
  .form-grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .form-hint{font-size:11px; color:var(--ink-soft); margin-top:4px;}
  .form-toggle{display:flex; gap:0; border:1px solid var(--border); border-radius:7px; overflow:hidden;}
  .form-toggle button{flex:1; padding:9px; background:var(--paper); border:none; font-size:13px; font-weight:600; color:var(--ink-soft);}
  .form-toggle button.on{background:var(--cover); color:#fff;}
  .form-toggle button.on.sell{background:var(--green);}
  .form-toggle button.on.profit{background:var(--red);}
  .form-toggle button.on.loss{background:var(--green);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .confirm-msg{font-size:13.5px; line-height:1.6; color:var(--ink);}
  .swatches{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer;}
  .swatch.picked{border-color:var(--ink);}
  .inline-check{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink);}
  .inline-check input{width:auto;}
  .month-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:4px;}
  .month-box{
    display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink);
    border:1px solid var(--border); border-radius:6px; padding:6px 8px; background:var(--paper);
  }
  .month-box input{width:auto;}

  /* Toast / stamp */
  #toastRoot{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{
    display:flex; align-items:center; gap:9px;
    background:var(--card); border:2px solid var(--red); color:var(--red);
    padding:9px 18px; border-radius:24px; font-size:13px; font-weight:700;
    box-shadow:0 10px 24px rgba(0,0,0,0.18);
    animation: popIn .2s ease, fadeOut .3s ease 1.9s forwards;
    transform:rotate(-2deg);
  }
  .toast .chop-ring{
    width:18px; height:18px; border-radius:50%; border:2px solid var(--red);
    display:flex; align-items:center; justify-content:center; font-size:9px;
  }
  @keyframes popIn{from{transform:scale(.7) rotate(-2deg); opacity:0;} to{transform:scale(1) rotate(-2deg); opacity:1;}}
  @keyframes fadeOut{to{opacity:0; transform:translateY(6px) rotate(-2deg);}}

  .footnote{font-size:11px; color:var(--ink-soft); text-align:center; margin-top:26px; line-height:1.7;}

  @media (max-width:600px){
    .form-grid2{grid-template-columns:1fr;}
    .dash-item{border-right:none; border-bottom:1px dotted var(--paper-line);}
    .cover-title h1{font-size:19px;}
  }

/* ===== v4：紀錄頁表格緊湊化 ===== */
.compact-record-table{
  width:100%;
  table-layout:auto;
}
.compact-record-table th,
.compact-record-table td{
  padding:7px 8px !important;
  line-height:1.25;
  vertical-align:middle;
  white-space:nowrap;
}
.compact-record-table th{font-size:12px;}
.compact-record-table td{font-size:13px;}
.compact-record-table th:first-child,
.compact-record-table td:first-child,
.compact-record-table th:last-child,
.compact-record-table td:last-child{width:1%;}
@media(max-width:700px){
  .compact-record-table th,
  .compact-record-table td{
    padding:6px 6px !important;
    font-size:12px;
  }
}


/* ===== v5：指定欄位取消被剩餘空間拉開 =====
   手動每日盈虧：日期 / 類型 / 金額靠攏
   還款紀錄：日期 / 還款金額靠攏
*/
.manual-daily-table,
.repayment-compact-table{
  width:max-content !important;
  min-width:100%;
  table-layout:auto !important;
}
.manual-daily-table th:nth-child(1),
.manual-daily-table td:nth-child(1){width:100px !important;}
.manual-daily-table th:nth-child(2),
.manual-daily-table td:nth-child(2){width:82px !important;}
.manual-daily-table th:nth-child(3),
.manual-daily-table td:nth-child(3){width:110px !important;}

.repayment-compact-table th:nth-child(1),
.repayment-compact-table td:nth-child(1){width:100px !important;}
.repayment-compact-table th:nth-child(2),
.repayment-compact-table td:nth-child(2){width:120px !important;}

/* 數字欄不再吃掉多餘寬度；備註欄吸收剩餘空間 */
.manual-daily-table th:nth-child(3),
.manual-daily-table td:nth-child(3),
.repayment-compact-table th:nth-child(2),
.repayment-compact-table td:nth-child(2){
  text-align:right;
}
@media(max-width:700px){
  .manual-daily-table th:nth-child(1),
  .manual-daily-table td:nth-child(1),
  .repayment-compact-table th:nth-child(1),
  .repayment-compact-table td:nth-child(1){width:88px !important;}
  .manual-daily-table th:nth-child(2),
  .manual-daily-table td:nth-child(2){width:68px !important;}
  .manual-daily-table th:nth-child(3),
  .manual-daily-table td:nth-child(3){width:96px !important;}
  .repayment-compact-table th:nth-child(2),
  .repayment-compact-table td:nth-child(2){width:104px !important;}
}


/* v6 配息紀錄欄位緊湊化 */
.dividend-compact-table{width:max-content!important;min-width:100%;table-layout:auto!important}
.dividend-compact-table th:nth-child(1),.dividend-compact-table td:nth-child(1){width:100px!important}
.dividend-compact-table th:nth-child(2),.dividend-compact-table td:nth-child(2){width:76px!important}
.dividend-compact-table th:nth-child(3),.dividend-compact-table td:nth-child(3){width:105px!important}
.dividend-compact-table th:nth-child(4),.dividend-compact-table td:nth-child(4){width:92px!important}
.dividend-compact-table th:nth-child(5),.dividend-compact-table td:nth-child(5){width:82px!important}
.dividend-compact-table th:nth-child(6),.dividend-compact-table td:nth-child(6){width:105px!important}
@media(max-width:700px){
.dividend-compact-table th:nth-child(1),.dividend-compact-table td:nth-child(1){width:88px!important}
.dividend-compact-table th:nth-child(2),.dividend-compact-table td:nth-child(2){width:66px!important}
.dividend-compact-table th:nth-child(3),.dividend-compact-table td:nth-child(3){width:92px!important}
.dividend-compact-table th:nth-child(4),.dividend-compact-table td:nth-child(4){width:82px!important}
.dividend-compact-table th:nth-child(5),.dividend-compact-table td:nth-child(5){width:72px!important}
.dividend-compact-table th:nth-child(6),.dividend-compact-table td:nth-child(6){width:94px!important}}

/* v7 庫存頁一鍵更新股價 */
@media(max-width:700px){
  .panel-tools [data-action="bulk-update-holdings-prices"]{
    padding:7px 9px;
    font-size:12px;
  }
}
</style>
</head>
<body>
<div id="app">
  <header class="cover">
    <div class="cover-inner">
      <div class="cover-title">
        <div class="cover-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3,17 9,11 13,15 21,5"></polyline>
            <polyline points="14,5 21,5 21,12"></polyline>
          </svg>
        </div>
        <div>
          <h1>股票紀錄</h1>
          <p class="cover-sub">個人證券損益紀錄・多帳戶管理</p>
        </div>
      </div>
      <div class="cover-actions">
        <button class="btn-ghost-cover" data-action="open-sync">☁ 同步設定</button>
        <button class="btn-ghost-cover" data-action="export-data">⬇ 匯出備份</button>
        <button class="btn-ghost-cover" data-action="trigger-import">⬆ 匯入備份</button>
        <input type="file" id="fileImport" accept="application/json" hidden>
        <button class="btn-ghost-cover" data-action="clear-local">🗑 清除本機資料</button>
        <button class="btn-ghost-cover" data-action="clear-all">✕ 清除全部資料</button>
      </div>
    </div>
    <div class="tabs-account" id="accountTabs"></div>
  </header>

  <main class="page">
    <div id="dashboardSummary"></div>

    <nav class="tabs-section" id="sectionTabs">
      <button data-tab="daily">每日盈虧</button>
      <button data-tab="transactions">交易紀錄</button>
      <button data-tab="dividends">配息紀錄</button>
      <button data-tab="holdings">庫存股票</button>
      <button data-tab="repayment">還款紀錄</button>
    </nav>

    <section id="panelRoot" class="panel"></section>

    <div id="dashboardCharts"></div>

    <p class="footnote">資料僅儲存於此瀏覽器（localStorage），請定期使用「匯出備份」保存檔案。手續費／證交稅為試算參考，實際請以券商對帳單為準。</p>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";

/* ============================= STORAGE ============================= */
const STORAGE_KEY = 'stockLedgerApp_v1';
const PALETTE = ['#2E7FB8','#D4A72C','#7A3B3B','#2B4C7E','#6B4E9C','#4A6FA5','#8A5A2B','#B5657A'];

function defaultState(){
  return {
    accounts: [],
    activeAccountId: 'all',
    transactions: [],   // {id, accountId, date, symbol, name, category, action, shares, price, fee, tax, dayTrade, note, seq}
    dividends: [],       // {id, accountId, date, symbol, name, perShare, shares, total, note}
    priceLogs: [],        // {id, date, symbol, price}

/*
  行情查詢 v2
  - 合併原本重複的兩套市場資料模組
  - 官方端點直連優先；若瀏覽器因 file:// / CORS 阻擋，才依序嘗試備援代理
  - 上市、上櫃分別記錄連線狀態，不再把「網路失敗」誤顯示成「查無此股票代號」
  - 日期同時支援民國/西元、YYYYMMDD / YYYMMDD / 斜線 / 連字號
*/
let marketDataCache = null;       // {byCode, fetchedAt, status:{twse,tpex}, errors:{twse,tpex}}
let marketDataFetchInFlight = null;

function withOverallTimeout(promise, ms){
  let timer;
  const timeout = new Promise((_, reject)=>{
    timer = setTimeout(()=>reject(new Error('操作逾時')), ms);
  });
  return Promise.race([promise, timeout]).finally(()=>clearTimeout(timer));
}

function numOrNull(v){
  if(v==null || v==='') return null;
  const n = parseFloat(String(v).replace(/,/g,''));
  return Number.isFinite(n) ? n : null;
}

function parseMarketDate(value){
  if(!value) return null;
  let s = String(value).trim();
  if(!s) return null;

  // 先處理含 / 或 - 的格式，例如 115/08/28、2026/08/28、2026-08-28
  let m = s.match(/^(\d{3,4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(m){
    let y = parseInt(m[1],10);
    if(y < 1911) y += 1911;
    return `${String(y).padStart(4,'0')}-${String(parseInt(m[2],10)).padStart(2,'0')}-${String(parseInt(m[3],10)).padStart(2,'0')}`;
  }

  // 去除非數字後再判斷 7 位民國或 8 位西元
  s = s.replace(/\D/g,'');
  if(/^\d{7}$/.test(s)){
    const y = parseInt(s.slice(0,3),10) + 1911;
    return `${y}-${s.slice(3,5)}-${s.slice(5,7)}`;
  }
  if(/^\d{8}$/.test(s)){
    return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
  }
  return null;
}

function rocToIso(v){ return parseMarketDate(v); }

async function fetchJsonOne(url, timeoutMs=8000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    const res = await fetch(url, {cache:'no-store', signal:controller.signal});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

async function fetchMarketJson(url, timeoutMs=8000){
  const attempts = [
    {name:'direct', url},
    {name:'corsproxy.io', url:'https://corsproxy.io/?url=' + encodeURIComponent(url)},
    {name:'allorigins', url:'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)}
  ];
  const errors = [];
  for(const a of attempts){
    try{
      return await fetchJsonOne(a.url, timeoutMs);
    }catch(e){
      errors.push(`${a.name}: ${e && e.message ? e.message : e}`);
    }
  }
  throw new Error(errors.join('；'));
}

function normalizeTwseRows(rows, byCode){
  if(!Array.isArray(rows)) throw new Error('TWSE 回傳格式不符');
  let count = 0;
  rows.forEach(r=>{
    const code = String(r.Code || r.code || '').trim().toUpperCase();
    if(!code) return;
    const name = String(r.Name || r.name || '').trim();
    const close = numOrNull(r.ClosingPrice != null ? r.ClosingPrice : r.Close);
    const date = parseMarketDate(r.Date || r.date);
    byCode[code] = {name, close, date, market:'上市'};
    count++;
  });
  if(count===0) throw new Error('TWSE 無有效股票資料');
}

function normalizeTpexRows(rows, byCode){
  if(!Array.isArray(rows)) throw new Error('TPEx 回傳格式不符');
  let count = 0;
  rows.forEach(r=>{
    const code = String(
      r.SecuritiesCompanyCode || r.Code || r.CompanyCode || r.SecurityCode || r.CommonStock || ''
    ).trim().toUpperCase();
    if(!code) return;
    const name = String(
      r.CompanyName || r.Name || r.CommonName || r.SecuritiesName || r.CodeName || ''
    ).trim();
    const close = numOrNull(
      r.Close != null ? r.Close :
      (r.ClosingPrice != null ? r.ClosingPrice : r.Close_Price)
    );
    const date = parseMarketDate(r.Date || r.date);
    byCode[code] = {name, close, date, market:'上櫃'};
    count++;
  });
  if(count===0) throw new Error('TPEx 無有效股票資料');
}

async function fetchTaiwanMarketSnapshot(forceRefresh=false){
  if(marketDataFetchInFlight) return marketDataFetchInFlight;
  if(marketDataCache && !forceRefresh && Date.now()-marketDataCache.fetchedAt < 5*60*1000){
    return marketDataCache;
  }

  marketDataFetchInFlight = (async ()=>{
    const byCode = {};
    const status = {twse:false, tpex:false};
    const errors = {twse:'', tpex:''};

    const [twseRes, tpexRes] = await Promise.allSettled([
      fetchMarketJson('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL'),
      fetchMarketJson('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes')
    ]);

    if(twseRes.status==='fulfilled'){
      try{
        normalizeTwseRows(twseRes.value, byCode);
        status.twse = true;
      }catch(e){
        errors.twse = e.message || String(e);
      }
    }else{
      errors.twse = twseRes.reason && twseRes.reason.message ? twseRes.reason.message : String(twseRes.reason);
    }

    if(tpexRes.status==='fulfilled'){
      try{
        normalizeTpexRows(tpexRes.value, byCode);
        status.tpex = true;
      }catch(e){
        errors.tpex = e.message || String(e);
      }
    }else{
      errors.tpex = tpexRes.reason && tpexRes.reason.message ? tpexRes.reason.message : String(tpexRes.reason);
    }

    if(!status.twse && !status.tpex){
      throw new Error('證交所與櫃買中心目前都無法連線。若你是直接開啟本機 HTML，可能是瀏覽器的 CORS / 網路限制；仍可手動輸入股票名稱與成交價。');
    }

    marketDataCache = {byCode, fetchedAt:Date.now(), status, errors};
    return marketDataCache;
  })();

  try{
    return await marketDataFetchInFlight;
  } finally {
    marketDataFetchInFlight = null;
  }
}

async function bulkFetchTodayPrices(){

      );

      if(info && info.ok && info.price!=null){

        if(info.name){
          state.holdingsMeta
            .filter(m=>m.symbol===symbol && (accId==='all' || m.accountId===accId))
            .forEach(m=>{
              if(!m.name || m.name===symbol) m.name = info.name;
            });

          state.transactions
            .filter(t=>t.symbol===symbol && (accId==='all' || t.accountId===accId))
            .forEach(t=>{
              if(!t.name || t.name===symbol) t.name = info.name;
            });
        }

        updated++;
      }else{
        failed.push({
          symbol,
          reason:(info && (info.reason || info.note)) || '查無可用收盤價'
        });
      }
    }catch(e){
      console.error('bulk single-symbol update failed', symbol, e);
      failed.push({
        symbol,
        reason:e && e.message ? e.message : '更新失敗'
      });
    }
  }

  if(updated>0){
    saveState(false);
    render();

    if(failed.length===0){
      stampToast(`已更新 ${updated} 檔庫存最近收盤價`);
    }else{

    }
  }else{

      ? failed.map(x=>`${x.symbol}：${x.reason}`).join('；')
      : '目前無法取得行情';
    stampToast(`本次沒有股票更新成功。${detail}`, true);

// Replays transactions up to (and including) asOfDate using weighted-average cost method.
function computeHoldingsAsOf(accountId, asOfDate){
  const txs = txForAccount(accountId)
    .filter(t=>t.date<=asOfDate)
    .sort((a,b)=> a.date.localeCompare(b.date) || (a.seq||0)-(b.seq||0));
  const map = {};
  let cumRealized = 0;
  for(const t of txs){
    const key = t.accountId + '|' + t.symbol;
    if(!map[key]) map[key] = {symbol:t.symbol, name:t.name, category:t.category, accountId:t.accountId, shares:0, cost:0};
    const h = map[key];
    if(t.action==='buy'){
      h.shares += t.shares;
      h.cost += t.shares*t.price + (t.fee||0);
      if(t.name) h.name = t.name;
      if(t.category) h.category = t.category;
    } else if(t.action==='sell'){
      const avg = h.shares>0 ? h.cost/h.shares : 0;
      const sellShares = Math.min(t.shares, h.shares);
      const soldCost = avg*sellShares;
      const proceeds = sellShares*t.price - (t.fee||0) - (t.tax||0);
      const realized = proceeds - soldCost;
      cumRealized += realized;
      h.cost = Math.max(0, h.cost - soldCost);
      h.shares = Math.max(0, h.shares - sellShares);
      if(h.shares < 0.0000001){ h.shares = 0; h.cost = 0; }
    }
  }
  const holdings = Object.values(map).filter(h=>h.shares>0.0000001).map(h=>{
    h.avgCost = h.shares>0 ? h.cost/h.shares : 0;
    return h;
  });
  return {holdings, cumRealizedPL: cumRealized};
}
function computeHoldings(accountId){ return computeHoldingsAsOf(accountId, todayStr()); }

function latestPrice(symbol, asOfDate){
  const logs = state.priceLogs.filter(p=>p.symbol===symbol && p.date<=asOfDate);
  if(logs.length===0) return null;
  logs.sort((a,b)=>a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  return logs[logs.length-1].price;
}

// 歷史上市收盤價：使用同一套 fetchMarketJson；失敗時只影響歷史價格，不影響股票代號辨識。
async function fetchTwseHistorical(symbol, dateIso){
  if(!symbol || !dateIso) return null;
  const [y,m,d] = dateIso.split('-');
  if(!y || !m || !d) return null;
  const url = `https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=${y}${m}01&stockNo=${encodeURIComponent(symbol)}`;
  const json = await fetchMarketJson(url);
  if(json.stat!=='OK' || !Array.isArray(json.data)) return null;

  let name = (json.title||'')
    .replace(/^\d+年\d+月\s*/, '')
    .replace(new RegExp('^' + String(symbol).replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\s*'), '')
    .replace(/\s*各日成交資訊\s*$/, '')
    .trim();

  const rocTarget = `${parseInt(y,10)-1911}/${m}/${d}`;
  const row = json.data.find(r=>String(r[0]||'').trim()===rocTarget);
  return {name, price:row ? numOrNull(row[6]) : null, date:dateIso};
}


// 若指定日期為週末、假日或休市日，往前尋找最近一次有成交資料的上市收盤價。
async function fetchTwseLatestCloseOnOrBefore(symbol, dateIso, maxLookbackDays=15){
  if(!symbol || !dateIso) return null;
  const base = new Date(dateIso + 'T12:00:00');
  if(Number.isNaN(base.getTime())) return null;

  for(let offset=0; offset<=maxLookbackDays; offset++){
    const d = new Date(base);
    d.setDate(base.getDate() - offset);
    const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(d.getDay()===0 || d.getDay()===6) continue;

    try{
      const hist = await fetchTwseHistorical(symbol, iso);
      if(hist && hist.price!=null) return {name:hist.name, price:hist.price, date:iso};
    }catch(e){
      console.warn('TWSE previous close lookup failed', iso, e);
    }
  }
  return null;
}

// 回傳 {ok, name, price, date, market, note, reason}
async function lookupStockInfo(symbol, dateIso){
  symbol = String(symbol||'').trim().toUpperCase();
  if(!symbol) return {ok:false, reason:'股票代號空白'};
  dateIso = dateIso || todayStr();

  let snap;
  try{
    snap = await withOverallTimeout(fetchTaiwanMarketSnapshot(false), 18000);
  }catch(e){
    console.error('Market snapshot failed', e);

    // 若整體快照失敗，仍最後嘗試一次 TWSE 個股歷史資料，以免上市股票被錯判。
    try{
      const hist = await withOverallTimeout(fetchTwseLatestCloseOnOrBefore(symbol, dateIso, 15), 16000);
      if(hist && hist.name){
        return {
          ok:true, name:hist.name, price:hist.price, date:hist.date||dateIso, market:'上市',
          note:(hist.date && hist.date!==dateIso) ? `${dateIso} 無收盤資料，已自動帶入最近交易日 ${hist.date} 的收盤價。` : ''
        };
      }
    }catch(_){}

    return {
      ok:false,
      reason:e && e.message ? e.message : '行情服務連線失敗，無法驗證股票代號；請稍後再試或手動輸入股票名稱。'
    };
  }

  const entry = snap.byCode[symbol];
  if(entry){
    // 使用者選的日期正好是最新交易日
    if(entry.date && entry.date===dateIso && entry.close!=null){
      return {ok:true, name:entry.name, price:entry.close, date:entry.date, market:entry.market};
    }

    // 上市股票：指定日期若休市，往前尋找最近一次收盤價。
    if(entry.market==='上市'){
      try{
        const hist = await withOverallTimeout(fetchTwseLatestCloseOnOrBefore(symbol, dateIso, 15), 16000);
        if(hist && hist.price!=null){
          return {
            ok:true, name:hist.name||entry.name, price:hist.price, date:hist.date, market:'上市',
            note:hist.date!==dateIso ? `${dateIso} 為非交易日或無收盤資料，已自動帶入最近交易日 ${hist.date} 的收盤價。` : ''
          };
        }
      }catch(e){
        console.warn('TWSE latest previous close lookup failed', e);
      }
    }

    // 上櫃每日快照本身就是最近交易日資料；上市歷史查詢失敗時也可使用快照備援。
    if(entry.close!=null && entry.date && entry.date <= dateIso){
      return {
        ok:true, name:entry.name||symbol, price:entry.close, date:entry.date, market:entry.market,
        note:entry.date!==dateIso ? `${dateIso} 為非交易日或無收盤資料，已自動帶入最近交易日 ${entry.date} 的收盤價。` : ''
      };
    }

    return {
      ok:true, name:entry.name||symbol, price:null, date:entry.date||dateIso, market:entry.market,
      note:`已辨識為${entry.market}「${entry.name||symbol}」，但暫時無法取得最近收盤價，成交價請手動輸入。`
    };
  }

  // 快照沒有代號時，若 TWSE 正常，仍可用歷史 API 再驗證一次上市股票。
  if(snap.status.twse){
    try{
      const hist = await withOverallTimeout(fetchTwseLatestCloseOnOrBefore(symbol, dateIso, 15), 16000);
      if(hist && hist.name){
        return {
          ok:true, name:hist.name, price:hist.price, date:hist.date||dateIso, market:'上市',
          note:(hist.date && hist.date!==dateIso) ? `${dateIso} 無收盤資料，已自動帶入最近交易日 ${hist.date} 的收盤價。` : ''
        };
      }
    }catch(e){
      console.warn('TWSE fallback lookup failed', e);
    }
  }

  // 只有兩個市場都成功回應，才有資格明確說「查無代號」。
  if(snap.status.twse && snap.status.tpex){
    return {ok:false, reason:'查無此股票代號（目前涵蓋上市／上櫃普通股票及 ETF）'};
  }

  const unavailable = [];
  if(!snap.status.twse) unavailable.push('證交所');
  if(!snap.status.tpex) unavailable.push('櫃買中心');
  return {
    ok:false,
    reason:`${unavailable.join('、')}目前無法連線，因此無法完整確認此代號；請稍後再試或手動輸入股票名稱。`
  };
}

function enrichHoldings(holdings, asOfDate){
  let totalMV = 0, totalCost = 0, totalUnreal = 0;
  const rows = holdings.map(h=>{
    const price = latestPrice(h.symbol, asOfDate);
    const cost = h.cost;
    const mv = price!=null ? price*h.shares : null;
    const unreal = mv!=null ? (mv - cost) : null;
    const unrealPct = (mv!=null && cost>0) ? unreal/cost : null;
    totalMV += (mv!=null? mv : cost);
    totalCost += cost;
    totalUnreal += (unreal!=null? unreal : 0);
    const meta = metaFor(h.accountId, h.symbol);
    return Object.assign({}, h, {price, cost, mv, unreal, unrealPct, meta});
  });
  rows.sort((a,b)=> (b.mv||b.cost) - (a.mv||a.cost));
  return {rows, totalMV, totalCost, totalUnreal};
}

/* ---- Fund status: manually-entered snapshots of capital invested vs borrowed ---- */
function fundLogsForAccount(accountId){
  return state.fundLogs.filter(f=>f.accountId===accountId).sort((a,b)=> b.date.localeCompare(a.date));
}
function repaymentLogsForAccount(accountId){
  if(accountId==='all') return state.repaymentLogs.slice().sort((a,b)=> b.date.localeCompare(a.date));
  return state.repaymentLogs.filter(r=>r.accountId===accountId).sort((a,b)=> b.date.localeCompare(a.date));
}
function totalRepaid(accountId){
  return repaymentLogsForAccount(accountId).reduce((s,r)=>s+(r.amount||0),0);
}
function latestFundStatus(accountId, asOfDate){
  const logs = state.fundLogs.filter(f=>f.accountId===accountId && f.date<=asOfDate);
  if(logs.length===0) return null;
  logs.sort((a,b)=> a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  return logs[logs.length-1];
}
function aggregateFundStatus(asOfDate){
  let own=0, margin=0, any=false;
  state.accounts.forEach(a=>{
    const l = latestFundStatus(a.id, asOfDate);
    if(l){ any=true; own += (l.ownAmount||0); margin += (l.marginAmount||0); }
  });
  return any ? {ownAmount:own, marginAmount:margin} : null;
}
function fundStatusFor(accountId, asOfDate){
  return accountId==='all' ? aggregateFundStatus(asOfDate) : latestFundStatus(accountId, asOfDate);
}

function computeDashboard(accountId){
  const {holdings, cumRealizedPL} = computeHoldingsAsOf(accountId, todayStr());
  const {rows, totalMV, totalCost, totalUnreal} = enrichHoldings(holdings, todayStr());
  const divs = divForAccount(accountId);
  const totalDiv = divs.reduce((s,d)=>s+(d.total||0),0);
  const fundStatus = fundStatusFor(accountId, todayStr());
  const totalPL = cumRealizedPL + totalUnreal + totalDiv;
  const returnOnOwn = (fundStatus && fundStatus.ownAmount>0) ? totalPL/fundStatus.ownAmount : null;
  return {rows, totalMV, totalCost, totalUnreal, cumRealizedPL, totalDiv, fundStatus, totalPL, returnOnOwn, totalRepaid: totalRepaid(accountId)};
}

function computeEquityCurve(accountId){
  const txs = txForAccount(accountId);
  const dateSet = new Set(txs.map(t=>t.date));
  const relevantSymbols = new Set(txs.map(t=>t.symbol));
  state.priceLogs.forEach(p=>{ if(relevantSymbols.has(p.symbol)) dateSet.add(p.date); });
  divForAccount(accountId).forEach(d=>dateSet.add(d.date));
  const dates = Array.from(dateSet).sort();
  if(dates.length===0) return [];
  const curve = dates.map(date=>{
    const {holdings, cumRealizedPL} = computeHoldingsAsOf(accountId, date);
    const {totalMV, totalCost} = enrichHoldings(holdings, date);
    const unreal = totalMV - totalCost;
    const divTotal = divForAccount(accountId).filter(d=>d.date<=date).reduce((s,d)=>s+(d.total||0),0);
    const total = cumRealizedPL + unreal + divTotal;
    return {date, total, cumRealizedPL, unreal, divTotal};
  });
  for(let i=0;i<curve.length;i++){
    curve[i].dailyPL = i===0 ? curve[i].total : curve[i].total - curve[i-1].total;
  }
  return curve;
}

/* ============================= MODAL / TOAST ============================= */
function openModal(title, bodyHtml, onMount){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-tear"></div>
      <div class="modal-head"><h3>${esc(title)}</h3><button class="modal-close" data-action="close-modal">✕</button></div>
      <div class="modal-body">${bodyHtml}</div>
    </div>
  </div>`;
  document.getElementById('modalOverlay').addEventListener('mousedown', e=>{
    if(e.target.id==='modalOverlay') closeModal();
  });
  if(onMount) onMount(root);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function confirmAction(message, onYes){
  openModal('請確認', `
    <p class="confirm-msg">${esc(message)}</p>
    <div class="modal-actions">
      <button class="btn-secondary" data-action="close-modal">取消</button>
      <button class="btn-danger" id="confirmYesBtn">確定執行</button>
    </div>`, (root)=>{
      root.querySelector('#confirmYesBtn').addEventListener('click', ()=>{ closeModal(); onYes(); });
    });
}

function stampToast(msg, isError){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  if(isError) el.style.borderColor = '#8A7F63';
  el.innerHTML = `<span class="chop-ring">${isError?'!':'印'}</span><span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2300);
}

/* ============================= MODALS: ACCOUNT ============================= */
function openAccountModal(editId){
  const editing = editId ? accountById(editId) : null;
  const usedColor = editing ? editing.color : PALETTE[state.accounts.length % PALETTE.length];
  const body = `
    <form id="accForm">
      <div class="form-row"><label>帳戶名稱</label><input type="text" id="accName" required placeholder="例如：元大證券" value="${editing?esc(editing.name):''}"></div>
      <div class="form-grid2">
        <div class="form-row"><label>券商</label><input type="text" id="accBroker" placeholder="例如：元大" value="${editing?esc(editing.broker||''):''}"></div>
        <div class="form-row"><label>帳戶類型</label>
          <select id="accType">
            <option value="cash" ${editing&&editing.type==='cash'?'selected':''}>現股</option>
            <option value="margin" ${editing&&editing.type==='margin'?'selected':''}>信用（融資融券）</option>
          </select>
        </div>
      </div>
      <div class="form-row"><label>手續費折數（1 = 不打折）</label><input type="number" step="0.01" min="0.1" max="1" id="accDiscount" value="${editing?editing.feeDiscount:1}"></div>
      <div class="form-row"><label>標籤顏色</label>
        <div class="swatches" id="colorSwatches">
          ${PALETTE.map(c=>`<span class="swatch ${c===usedColor?'picked':''}" data-color="${c}" style="background:${c}"></span>`).join('')}
        </div>
      </div>
      <div class="modal-actions">
        ${editing?`<button type="button" class="btn-danger" id="accDeleteBtn" style="margin-right:auto;">刪除帳戶</button>`:''}
        <button type="button" class="btn-secondary" data-action="close-modal">取消</button>
        <button type="submit" class="btn-stamp">${editing?'儲存變更':'新增帳戶'}</button>
      </div>
    </form>`;
  openModal(editing?'編輯帳戶':'新增帳戶', body, (root)=>{
    let picked = usedColor;
    root.querySelectorAll('.swatch').forEach(sw=>{
      sw.addEventListener('click', ()=>{
        root.querySelectorAll('.swatch').forEach(s=>s.classList.remove('picked'));
        sw.classList.add('picked'); picked = sw.dataset.color;
      });
    });
    root.querySelector('#accForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const name = root.querySelector('#accName').value.trim();
      if(!name) return;
      if(editing){
        editing.name = name;
        editing.broker = root.querySelector('#accBroker').value.trim();
        editing.type = root.querySelector('#accType').value;
        editing.feeDiscount = parseFloat(root.querySelector('#accDiscount').value)||1;
        editing.color = picked;
      } else {
        const a = {
          id: uid(), name, broker: root.querySelector('#accBroker').value.trim(),
          type: root.querySelector('#accType').value,
          feeDiscount: parseFloat(root.querySelector('#accDiscount').value)||1,
          color: picked
        };
        state.accounts.push(a);
        state.activeAccountId = a.id;
      }
      saveState();
      closeModal();
      render();
    });
    if(editing){
      root.querySelector('#accDeleteBtn').addEventListener('click', ()=>{
        closeModal();
        confirmAction(`確定要刪除帳戶「${editing.name}」嗎？此帳戶所有交易、配息與紀錄將一併刪除，且無法復原。`, ()=>{
          state.transactions = state.transactions.filter(t=>t.accountId!==editing.id);
          state.dividends = state.dividends.filter(d=>d.accountId!==editing.id);
          state.holdingsMeta = state.holdingsMeta.filter(m=>m.accountId!==editing.id);
          state.fundLogs = state.fundLogs.filter(f=>f.accountId!==editing.id);
          state.repaymentLogs = state.repaymentLogs.filter(r=>r.accountId!==editing.id);
          state.dailyPLLogs = state.dailyPLLogs.filter(l=>l.accountId!==editing.id);
          state.accounts = state.accounts.filter(a=>a.id!==editing.id);
          if(state.activeAccountId===editing.id) state.activeAccountId='all';
          saveState();
          render();
        });
      });
    }
  });
}

function accountSelectHtml(selectedId){
  const opts = state.accounts.map(a=>`<option value="${a.id}" ${a.id===selectedId?'selected':''}>${esc(a.name)}</option>`).join('');
  return `<select id="txAccount">${opts}</select>`;
}
function currentHoldingsForAccount(accountId, asOfDate){
  const {holdings} = computeHoldingsAsOf(accountId, asOfDate||todayStr());
  return holdings;
}

function openTransactionModal(opts){
  opts = opts || {};
  const editing = opts.editId ? state.transactions.find(t=>t.id===opts.editId) : null;
  let action = editing ? editing.action : (opts.action || 'buy');
  const fixedAccount = activeIsAll() ? null : state.activeAccountId;
  let selectedAccount = editing ? editing.accountId : (opts.accountId || fixedAccount || (state.accounts[0] && state.accounts[0].id));
  const presetSymbol = opts.symbol || (editing ? editing.symbol : '');

  function accountBlock(){
    if(fixedAccount) return `<input type="hidden" id="txAccount" value="${fixedAccount}"><div class="form-row"><label>帳戶</label><input type="text" disabled value="${esc(accountById(fixedAccount).name)}"></div>`;
    return `<div class="form-row"><label>帳戶</label>${accountSelectHtml(selectedAccount)}</div>`;
  }

  function holdingOptionsHtml(accId){
    const holdings = currentHoldingsForAccount(accId);
    if(holdings.length===0) return '<option value="">（此帳戶尚無庫存）</option>';
    return holdings.map(h=>`<option value="${esc(h.symbol)}" data-name="${esc(h.name||'')}" data-cat="${h.category}" data-shares="${h.shares}" ${h.symbol===presetSymbol?'selected':''}>${esc(h.symbol)} ${esc(h.name||'')}（庫存 ${fmtShares(h.shares)}）</option>`).join('');
  }

  function bodyHtml(){
    const isBuy = action==='buy';
    return `
    <form id="txForm">
      <div class="form-toggle" style="margin-bottom:14px;">
        <button type="button" class="toggle-buy ${isBuy?'on':''}" data-act="buy">買進</button>
        <button type="button" class="toggle-sell ${!isBuy?'on sell':''}" data-act="sell">賣出</button>
      </div>
      <div id="txAccountWrap">${accountBlock()}</div>
      <div class="form-grid2">
        <div class="form-row"><label>日期</label><input type="date" id="txDate" value="${editing?editing.date:todayStr()}" required></div>
        <div class="form-row"><label>類別</label>
          <select id="txCategory">
            <option value="stock" ${editing&&editing.category==='stock'?'selected':''}>個股</option>
            <option value="etf" ${editing&&editing.category==='etf'?'selected':''}>ETF</option>
          </select>
        </div>
      </div>
      <div id="symbolFieldWrap"></div>
      <div class="form-grid2">
        <div class="form-row"><label>股數</label><input type="number" step="1" min="0" id="txShares" value="${editing?editing.shares:''}" required></div>
        <div class="form-row"><label>成交價</label><input type="number" step="0.01" min="0" id="txPrice" value="${editing?editing.price:''}" required></div>
      </div>
      <div class="form-grid2">
        <div class="form-row"><label>手續費 <button type="button" class="btn-text" id="txFeeAuto">自動試算</button></label><input type="number" step="1" id="txFee" value="${editing?editing.fee:0}"></div>
        <div class="form-row" id="taxWrap" style="${isBuy?'display:none;':''}"><label>證交稅 <button type="button" class="btn-text" id="txTaxAuto">自動試算</button></label><input type="number" step="1" id="txTax" value="${editing?editing.tax:0}"></div>
      </div>
      <div class="form-row" id="dayTradeWrap" style="${isBuy?'display:none;':''}">
        <label class="inline-check"><input type="checkbox" id="txDayTrade" ${editing&&editing.dayTrade?'checked':''}> 當日沖銷（證交稅折半）</label>
      </div>
      <div class="form-row"><label>備註</label><textarea id="txNote">${editing?esc(editing.note||''):''}</textarea></div>
      <div class="modal-actions">
        ${editing?`<button type="button" class="btn-danger" id="txDeleteBtn" style="margin-right:auto;">刪除</button>`:''}
        <button type="button" class="btn-secondary" data-action="close-modal">取消</button>
        <button type="submit" class="btn-stamp">${editing?'儲存變更':'新增交易'}</button>
      </div>
    </form>`;
  }

  function symbolFieldHtml(){
    if(action==='sell'){
      return `<div class="form-row"><label>股票（僅顯示目前庫存）</label>
        <select id="txSymbolSelect">${holdingOptionsHtml(selectedAccount)}</select>
      </div>`;
    }
    return `<div class="form-grid2">
      <div class="form-row"><label>股票代號 <button type="button" class="btn-text" id="txSymbolLookupBtn">🔍 查詢</button></label><input type="text" id="txSymbol" value="${editing?esc(editing.symbol):esc(presetSymbol)}" required placeholder="例如 2330"></div>
      <div class="form-row"><label>股票名稱</label><input type="text" id="txName" value="${editing?esc(editing.name||''):''}" placeholder="例如 台積電"></div>
    </div>`;
  }

  openModal(editing?'編輯交易':'新增交易', bodyHtml(), (root)=>{
    function mountSymbolField(){
      root.querySelector('#symbolFieldWrap').innerHTML = symbolFieldHtml();
      const sel = root.querySelector('#txSymbolSelect');
      if(sel){
        sel.addEventListener('change', syncSellShareMax);
        syncSellShareMax();
      }
      const lookupBtn = root.querySelector('#txSymbolLookupBtn');
      if(lookupBtn){
        lookupBtn.addEventListener('click', async ()=>{
          const symbol = root.querySelector('#txSymbol').value.trim();
          const date = root.querySelector('#txDate').value;
          if(!symbol){ stampToast('請先輸入股票代號', true); return; }
          const origText = lookupBtn.textContent;
          lookupBtn.textContent = '查詢中…'; lookupBtn.disabled = true;
          try{
            const info = await withOverallTimeout(lookupStockInfo(symbol, date), 20000);
            if(!info.ok){ stampToast(info.reason || '查詢失敗，請手動輸入', true); return; }
            if(info.name) root.querySelector('#txName').value = info.name;
            if(/^00/.test(symbol)) root.querySelector('#txCategory').value = 'etf';
            if(info.price!=null){
              stampToast(`${info.market} ${info.name||symbol}　參考收盤 ${fmtMoney(info.price)}（${info.date}，非成交價，請自行填入實際成交價）`);
            } else {
              stampToast(info.note || `已帶入公司名稱（${info.market}），查無該日收盤價`);
            }
          }catch(e){
            console.error(e);
            stampToast('查詢失敗（可能無網路連線），請手動輸入', true);
          }finally{
            lookupBtn.textContent = origText; lookupBtn.disabled = false;
          }
        });
      }
    }
    function syncSellShareMax(){
      const sel = root.querySelector('#txSymbolSelect');
      if(!sel || !sel.value) return;
      const opt = sel.options[sel.selectedIndex];
      root.querySelector('#txShares').max = opt.dataset.shares;
      root.querySelector('#txShares').placeholder = '最多 ' + Number(opt.dataset.shares).toLocaleString('en-US');
      root.querySelector('#txCategory').value = opt.dataset.cat;
    }
    mountSymbolField();

    function recalcFeeTax(){
      const shares = parseFloat(root.querySelector('#txShares').value)||0;
      const price = parseFloat(root.querySelector('#txPrice').value)||0;
      const acc = accountById(root.querySelector('#txAccount') ? root.querySelector('#txAccount').value : selectedAccount);
      const discount = acc ? acc.feeDiscount : 1;
      root.querySelector('#txFee').value = calcDefaultFee(shares, price, discount);
      if(action==='sell'){
        const cat = root.querySelector('#txCategory').value;
        const dayTrade = root.querySelector('#txDayTrade') && root.querySelector('#txDayTrade').checked;
        root.querySelector('#txTax').value = calcDefaultTax(shares, price, cat, dayTrade);
      }
    }
    root.querySelector('#txFeeAuto').addEventListener('click', recalcFeeTax);
    const taxAutoBtn = root.querySelector('#txTaxAuto');
    if(taxAutoBtn) taxAutoBtn.addEventListener('click', recalcFeeTax);
    const dtCheck = root.querySelector('#txDayTrade');
    if(dtCheck) dtCheck.addEventListener('change', recalcFeeTax);

    function switchAction(newAction){
      action = newAction;
      root.querySelector('.toggle-buy').classList.toggle('on', action==='buy');
      root.querySelector('.toggle-sell').classList.toggle('on', action==='sell');
      root.querySelector('.toggle-sell').classList.toggle('sell', action==='sell');
      root.querySelector('#dayTradeWrap').style.display = action==='buy' ? 'none' : '';
      root.querySelector('#taxWrap').style.display = action==='buy' ? 'none' : '';
      mountSymbolField();
      recalcFeeTax();
    }
    root.querySelector('.toggle-buy').addEventListener('click', ()=>switchAction('buy'));
    root.querySelector('.toggle-sell').addEventListener('click', ()=>switchAction('sell'));

    const accSel = root.querySelector('#txAccount');
    if(accSel && accSel.tagName==='SELECT'){
      accSel.addEventListener('change', ()=>{ selectedAccount = accSel.value; mountSymbolField(); });
    }

    root.querySelector('#txForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const accountId = root.querySelector('#txAccount').value;
      const date = root.querySelector('#txDate').value;
      const shares = parseFloat(root.querySelector('#txShares').value)||0;
      const price = parseFloat(root.querySelector('#txPrice').value)||0;
      const fee = parseFloat(root.querySelector('#txFee').value)||0;
      let symbol, name, category;
      if(action==='sell'){
        const sel = root.querySelector('#txSymbolSelect');
        if(!sel.value){ stampToast('此帳戶尚無庫存可賣出', true); return; }
        const opt = sel.options[sel.selectedIndex];
        symbol = sel.value; name = opt.dataset.name; category = opt.dataset.cat;
        const maxShares = parseFloat(opt.dataset.shares);
        if(shares>maxShares+0.0001){ stampToast('賣出股數超過庫存', true); return; }
      } else {
        symbol = root.querySelector('#txSymbol').value.trim();
        name = root.querySelector('#txName').value.trim();
        category = root.querySelector('#txCategory').value;
      }
      if(shares<=0 || price<=0 || !symbol){ stampToast('請完整輸入股數、價格與代號', true); return; }
      const tax = action==='sell' ? (parseFloat(root.querySelector('#txTax').value)||0) : 0;
      const dayTrade = action==='sell' && root.querySelector('#txDayTrade').checked;
      const note = root.querySelector('#txNote').value.trim();

      if(editing){
        Object.assign(editing, {accountId, date, symbol, name, category, action, shares, price, fee, tax, dayTrade, note});
      } else {
        state.transactions.push({
          id: uid(), seq: seqCounter++, accountId, date, symbol, name, category, action,
          shares, price, fee, tax, dayTrade, note
        });
      }
      ensureMeta(accountId, symbol, name, category);
      saveState();
      closeModal();
      render();
    });

    if(editing){
      root.querySelector('#txDeleteBtn').addEventListener('click', ()=>{
        closeModal();
        confirmAction('確定要刪除這筆交易紀錄嗎？', ()=>{
          state.transactions = state.transactions.filter(t=>t.id!==editing.id);
          saveState();
          render();
        });
      });
    }
  });
}

/* ============================= MODALS: DIVIDEND ============================= */
function openDividendModal(editId){
  const editing = editId ? state.dividends.find(d=>d.id===editId) : null;
  const fixedAccount = activeIsAll() ? null : state.activeAccountId;
  let selectedAccount = editing ? editing.accountId : (fixedAccount || (state.accounts[0]&&state.accounts[0].id));

  function holdingOptions(accId){
    const holdings = currentHoldingsForAccount(accId);
    if(holdings.length===0) return '<option value="">（此帳戶尚無庫存）</option>';
    return holdings.map(h=>`<option value="${esc(h.symbol)}" data-name="${esc(h.name||'')}" data-shares="${h.shares}" ${editing&&editing.symbol===h.symbol?'selected':''}>${esc(h.symbol)} ${esc(h.name||'')}（庫存 ${fmtShares(h.shares)}）</option>`).join('');
  }

  const body = `
  <form id="divForm">
    ${fixedAccount?`<input type="hidden" id="divAccount" value="${fixedAccount}">`:`<div class="form-row"><label>帳戶</label>${accountSelectHtml(selectedAccount)}</div>`}
    <div class="form-row"><label>日期</label><input type="date" id="divDate" value="${editing?editing.date:todayStr()}" required></div>
    <div class="form-row"><label>股票</label><select id="divSymbol">${holdingOptions(selectedAccount)}</select></div>
    <div class="form-grid2">
      <div class="form-row"><label>每股配息金額</label><input type="number" step="0.001" id="divPerShare" value="${editing?editing.perShare:''}"></div>
      <div class="form-row"><label>股數</label><input type="number" step="1" id="divShares" value="${editing?editing.shares:''}"></div>
    </div>
    <div class="form-row"><label>總金額</label><input type="number" step="1" id="divTotal" value="${editing?editing.total:''}"></div>
    <div class="form-row"><label>備註</label><textarea id="divNote">${editing?esc(editing.note||''):''}</textarea></div>
    <div class="modal-actions">
      ${editing?`<button type="button" class="btn-danger" id="divDeleteBtn" style="margin-right:auto;">刪除</button>`:''}
      <button type="button" class="btn-secondary" data-action="close-modal">取消</button>
      <button type="submit" class="btn-stamp">${editing?'儲存變更':'新增配息'}</button>
    </div>
  </form>`;
  openModal(editing?'編輯配息':'新增配息紀錄', body, (root)=>{
    if(editing) root.querySelector('#divAccount') && (root.querySelector('#divAccount').value = editing.accountId);
    const accSel = root.querySelector('#divAccount');
    if(accSel && accSel.tagName==='SELECT'){
      accSel.addEventListener('change', ()=>{
        selectedAccount = accSel.value;
        root.querySelector('#divSymbol').innerHTML = holdingOptions(selectedAccount);
        syncShares();
      });
    }
    function syncShares(){
      const sel = root.querySelector('#divSymbol');
      if(sel && sel.value){
        const opt = sel.options[sel.selectedIndex];
        if(!editing) root.querySelector('#divShares').value = opt.dataset.shares;
      }
      recalcTotal();
    }
    root.querySelector('#divSymbol').addEventListener('change', syncShares);
    function recalcTotal(){
      const per = parseFloat(root.querySelector('#divPerShare').value)||0;
      const sh = parseFloat(root.querySelector('#divShares').value)||0;
      if(per>0 && sh>0 && !root.dataset.totalTouched) root.querySelector('#divTotal').value = Math.round(per*sh);
    }
    root.querySelector('#divPerShare').addEventListener('input', recalcTotal);
    root.querySelector('#divShares').addEventListener('input', recalcTotal);
    root.querySelector('#divTotal').addEventListener('input', ()=>{ root.dataset.totalTouched='1'; });
    if(!editing) syncShares();

    root.querySelector('#divForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const accountId = fixedAccount || root.querySelector('#divAccount').value;
      const sel = root.querySelector('#divSymbol');
      const symbol = sel.value;
      if(!symbol){ stampToast('此帳戶尚無庫存', true); return; }
      const opt = sel.options[sel.selectedIndex];
      const name = opt.dataset.name;
      const date = root.querySelector('#divDate').value;
      const perShare = parseFloat(root.querySelector('#divPerShare').value)||0;
      const shares = parseFloat(root.querySelector('#divShares').value)||0;
      const total = parseFloat(root.querySelector('#divTotal').value)||0;
      const note = root.querySelector('#divNote').value.trim();
      if(editing){
        Object.assign(editing, {accountId, date, symbol, name, perShare, shares, total, note});
      } else {
        state.dividends.push({id:uid(), accountId, date, symbol, name, perShare, shares, total, note});
      }
      saveState();
      closeModal();
      currentTab='dividends';
      render();
    });
    if(editing){
      root.querySelector('#divDeleteBtn').addEventListener('click', ()=>{
        closeModal();
        confirmAction('確定要刪除這筆配息紀錄嗎？', ()=>{
          state.dividends = state.dividends.filter(d=>d.id!==editing.id);
          saveState();
          render();
        });
      });
    }
  });
}

/* ============================= MODALS: MANUAL DAILY P&L LOG ============================= */

  function bodyHtml(){
    return `
    <form id="dailyLogForm">
      <div class="form-toggle" style="margin-bottom:14px;">

      } else {
        state.dailyPLLogs.push({id:uid(), accountId, date, type, amount, note});

      saveState();
      closeModal();

      root.querySelector('#dailyLogDeleteBtn').addEventListener('click', ()=>{
        closeModal();

          state.dailyPLLogs = state.dailyPLLogs.filter(l=>l.id!==editing.id);

/* ============================= MODALS: META (holding info / expected dividend) ============================= */
function openMetaModal(accountId, symbol){
  const meta = ensureMeta(accountId, symbol);
  const months = meta.expectedMonths || [];
  const freqNeedsMonths = ['年配','半年配','季配'];
  const monthHint = {
    '年配':'年配通常為 1 個月',
    '半年配':'半年配通常為 2 個月（例如 1 月、7 月）',
    '季配':'季配通常為 4 個月（例如 3、6、9、12 月）'
  };
  function monthGridHtml(){
    let boxes = '';
    for(let m=1;m<=12;m++){
      boxes += `<label class="month-box"><input type="checkbox" class="month-check" value="${m}" ${months.includes(m)?'checked':''}>${m}月</label>`;
    }
    return `<div class="form-row" id="monthsWrap" style="${freqNeedsMonths.includes(meta.freq)?'':'display:none;'}">
      <label>預計配息月份（可複選）</label>
      <div class="month-grid">${boxes}</div>
      <div class="form-hint" id="monthsHint">${monthHint[meta.freq]||''}</div>
    </div>`;
  }
  const body = `
  <form id="metaForm">
    <div class="form-row"><label>股票代號</label><input type="text" value="${esc(symbol)}" disabled></div>
    <div class="form-grid2">
      <div class="form-row"><label>股票名稱</label><input type="text" id="metaName" value="${esc(meta.name||'')}"></div>
      <div class="form-row"><label>類別</label>
        <select id="metaCategory">
          <option value="stock" ${meta.category==='stock'?'selected':''}>個股</option>
          <option value="etf" ${meta.category==='etf'?'selected':''}>ETF</option>
        </select>
      </div>
    </div>
    <div class="form-row"><label>配息頻率</label>
      <select id="metaFreq">
        ${['未設定','年配','半年配','季配','月配','不定期'].map(f=>`<option value="${f}" ${meta.freq===f?'selected':''}>${f}</option>`).join('')}
      </select>
    </div>
    <div id="monthsWrapOuter">${monthGridHtml()}</div>
    <div class="form-row"><label>下一次預計確切日期（選填）</label><input type="date" id="metaDate" value="${meta.expectedDate||''}"></div>
    <div class="form-row"><label>備註</label><textarea id="metaNote">${esc(meta.note||'')}</textarea></div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" data-action="close-modal">取消</button>
      <button type="submit" class="btn-stamp">儲存</button>
    </div>
  </form>`;
  openModal('持股資訊 － ' + symbol, body, (root)=>{
    root.querySelector('#metaFreq').addEventListener('change', (e)=>{
      const wrap = root.querySelector('#monthsWrap');
      const show = freqNeedsMonths.includes(e.target.value);
      wrap.style.display = show ? '' : 'none';
      root.querySelector('#monthsHint').textContent = monthHint[e.target.value] || '';
    });
    root.querySelector('#metaForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const freq = root.querySelector('#metaFreq').value;
      meta.name = root.querySelector('#metaName').value.trim();
      meta.category = root.querySelector('#metaCategory').value;
      meta.freq = freq;
      meta.expectedMonths = freqNeedsMonths.includes(freq)
        ? Array.from(root.querySelectorAll('.month-check:checked')).map(el=>parseInt(el.value,10)).sort((a,b)=>a-b)
        : [];
      meta.expectedDate = root.querySelector('#metaDate').value;
      meta.note = root.querySelector('#metaNote').value.trim();
      saveState();
      closeModal();
      render();
    });
  });
}

/* ============================= MODALS: PRICE LOG ============================= */
function openPriceModal(presetSymbol){
  const accId = activeIsAll() ? (state.accounts[0]&&state.accounts[0].id) : state.activeAccountId;
  const holdings = currentHoldingsForAccount(accId);
  const options = holdings.map(h=>`<option value="${esc(h.symbol)}" ${h.symbol===presetSymbol?'selected':''}>${esc(h.symbol)} ${esc(h.name||'')}</option>`).join('');
  const body = `
  <form id="priceForm">
    <div class="form-row"><label>股票</label><select id="priceSymbol">${options || '<option value="">（尚無庫存）</option>'}</select></div>
    <div class="form-grid2">
      <div class="form-row"><label>日期</label><input type="date" id="priceDate" value="${todayStr()}" required></div>
      <div class="form-row"><label>收盤價 <button type="button" class="btn-text" id="priceLookupBtn">🔍 自動抓取</button></label><input type="number" step="0.01" min="0" id="priceValue" required></div>
    </div>
    <div class="form-hint">自動抓取取自證交所／櫃買中心公開資料；若選擇日期為週末、國定假日或休市日，會自動帶入該日期以前最近一個交易日的收盤價。用於試算未實現損益與每日盈虧走勢，不影響已成交的交易紀錄。</div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" data-action="close-modal">取消</button>
      <button type="submit" class="btn-stamp">儲存價格</button>
    </div>
  </form>`;
  openModal('記錄收盤價', body, (root)=>{
    root.querySelector('#priceLookupBtn').addEventListener('click', async ()=>{
      const symbol = root.querySelector('#priceSymbol').value;
      const date = root.querySelector('#priceDate').value;
      if(!symbol){ stampToast('沒有可查詢的股票', true); return; }
      const btn = root.querySelector('#priceLookupBtn');
      const origText = btn.textContent;
      btn.textContent = '查詢中…'; btn.disabled = true;
      try{
        const info = await withOverallTimeout(lookupStockInfo(symbol, date), 20000);
        if(!info.ok){ stampToast(info.reason || '查詢失敗，請手動輸入', true); return; }
        if(info.price!=null){
          root.querySelector('#priceValue').value = info.price;
          stampToast(`已帶入 ${info.market} ${info.name||symbol} ${info.date} 收盤價`);
        } else {
          stampToast(info.note || '查無收盤價，請手動輸入', true);
        }
      }catch(e){
        console.error(e);
        stampToast('查詢失敗（可能無網路連線），請手動輸入', true);
      }finally{
        btn.textContent = origText; btn.disabled = false;
      }
    });
    root.querySelector('#priceForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const symbol = root.querySelector('#priceSymbol').value;
      if(!symbol){ stampToast('沒有可設定價格的股票', true); return; }
      const date = root.querySelector('#priceDate').value;
      const price = parseFloat(root.querySelector('#priceValue').value);
      if(!(price>0)) return;
      state.priceLogs.push({id:uid(), date, symbol, price});
      saveState();
      closeModal();
      render();
    });
  });
}

/* ============================= MODALS: CLOUD SYNC ============================= */
function openSyncModal(){
  if(!isFirebaseConfigured()){
    openModal('線上同步', `
      <p class="confirm-msg">這台裝置尚未完成 Firebase 後端設定，暫時無法使用線上同步。請先依照設定步驟建立 Firebase 專案，並將設定值填入檔案中的 <code>firebaseConfig</code>。</p>
      <div class="modal-actions"><button type="button" class="btn-secondary" data-action="close-modal">關閉</button></div>
    `);
    return;
  }
  const statusLabel = !syncCode ? '尚未啟用同步'
    : syncStatus==='connected' ? '已連線，同步中'
    : syncStatus==='connecting' ? '連線中…'
    : syncStatus==='error' ? '連線失敗，請確認網路'
    : '尚未啟用同步';
  const statusColor = syncStatus==='connected' ? 'var(--red)' : syncStatus==='error' ? 'var(--flat)' : 'var(--ink-soft)';

  const body = syncCode ? `
    <p class="confirm-msg" style="color:${statusColor};font-weight:600;">${esc(statusLabel)}</p>
    <div class="form-row">
      <label>目前同步代碼</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="text" id="syncCodeDisplay" value="${esc(syncCode)}" readonly class="mono" style="letter-spacing:3px; font-weight:700; text-align:center;">
        <button type="button" class="btn-text" id="copyCodeBtn" style="white-space:nowrap;">複製</button>
      </div>
      <div class="form-hint">在其他裝置開啟同一份檔案，點選「☁ 同步設定」並輸入這組代碼，就會自動同步所有資料。請勿分享給不信任的人——持有代碼者即可讀寫這份資料。</div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-danger" id="stopSyncBtn" style="margin-right:auto;">停用同步</button>
      <button type="button" class="btn-secondary" data-action="close-modal">關閉</button>
    </div>
  ` : `
    <p class="confirm-msg">輸入其他裝置上已經在用的同步代碼，或產生一組新代碼給這台裝置使用。</p>
    <div class="form-row">
      <label>同步代碼</label>
      <input type="text" id="syncCodeInput" maxlength="8" placeholder="例如 A7K3M9QZ" style="text-transform:uppercase; letter-spacing:3px; text-align:center; font-weight:700;">
    </div>
    <div class="modal-actions" style="justify-content:space-between;">
      <button type="button" class="btn-secondary" id="genCodeBtn">產生新代碼</button>
      <button type="button" class="btn-stamp" id="applyCodeBtn">套用並開始同步</button>
    </div>
    <div class="form-hint" style="margin-top:12px;">第一次設定：在第一台裝置按「產生新代碼」並套用；接着到其他裝置的「☁ 同步設定」輸入同一組代碼即可自動帶入現有資料。</div>
  `;

  openModal('線上同步', body, (root)=>{
    if(syncCode){
      root.querySelector('#copyCodeBtn').addEventListener('click', ()=>{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(syncCode).then(()=>stampToast('已複製代碼')).catch(()=>stampToast('複製失敗', true));
        } else {
          const el = root.querySelector('#syncCodeDisplay'); el.select();
          try{ document.execCommand('copy'); stampToast('已複製代碼'); }catch(e){ stampToast('複製失敗', true); }
        }
      });
      root.querySelector('#stopSyncBtn').addEventListener('click', ()=>{
        closeModal();
        confirmAction('確定要停用同步嗎？停用後這台裝置只會使用本機儲存，不會再自動更新或接收其他裝置的資料。', ()=>{
          stopSync();
          stampToast('已停用同步');
        });
      });
    } else {
      root.querySelector('#genCodeBtn').addEventListener('click', ()=>{
        root.querySelector('#syncCodeInput').value = genSyncCode();
      });
      root.querySelector('#applyCodeBtn').addEventListener('click', ()=>{
        const code = root.querySelector('#syncCodeInput').value.trim().toUpperCase();
        if(code.length<4){ stampToast('請輸入或產生代碼', true); return; }
        closeModal();
        startSync(code);
        stampToast('已套用代碼，開始同步…');
      });
    }
  });
}

/* ============================= MODALS: FUND STATUS LOG ============================= */
function openFundLogModal(preselectAccount){
  const fixedAccount = activeIsAll() ? null : state.activeAccountId;
  let selectedAccount = preselectAccount || fixedAccount || (state.accounts[0] && state.accounts[0].id);

  function historyHtml(accId){
    const logs = fundLogsForAccount(accId);
    if(logs.length===0) return '<p class="form-hint">此帳戶尚無資金紀錄。</p>';
    return `<div class="ledger-wrap" style="margin-bottom:14px;"><table>
      <thead><tr><th>日期</th><th class="num">自有資金</th><th class="num">借貸資金</th><th>備註</th><th></th></tr></thead>
      <tbody>${logs.map(l=>`<tr>
        <td class="mono">${l.date}</td>
        <td class="num">${fmtMoney(l.ownAmount)}</td>
        <td class="num">${fmtMoney(l.marginAmount)}</td>
        <td style="font-size:11.5px;color:var(--ink-soft);">${esc(l.note||'')}</td>
        <td><button type="button" class="btn-icon fund-del-btn" data-id="${l.id}" title="刪除">🗑</button></td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  }

  const body = `
    ${fixedAccount?'':`<div class="form-row"><label>帳戶</label>${accountSelectHtml(selectedAccount)}</div>`}
    <div id="fundHistoryWrap">${historyHtml(selectedAccount)}</div>
    <form id="fundLogForm">
      <div class="form-grid2">
        <div class="form-row"><label>日期</label><input type="date" id="fundDate" value="${todayStr()}" required></div>
        <div class="form-row"><label>&nbsp;</label></div>
      </div>
      <div class="form-grid2">
        <div class="form-row"><label>目前自有資金</label><input type="number" step="1" min="0" id="fundOwn" value="0" required></div>
        <div class="form-row"><label>目前借貸資金</label><input type="number" step="1" min="0" id="fundMargin" value="0" required></div>
      </div>
      <div class="form-row"><label>備註</label><input type="text" id="fundNote" placeholder="選填"></div>
      <div class="form-hint">記錄「目前」投入與借貸的資金總額即可，不需對應到個別交易；之後想更新時再新增一筆最新紀錄即可，儀表板會自動採用最新一筆。每期還款金額請至「還款紀錄」頁籤記錄。</div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" data-action="close-modal">關閉</button>
        <button type="submit" class="btn-stamp">新增紀錄</button>
      </div>
    </form>`;

  openModal('資金狀況', body, (root)=>{
    function bindDeleteButtons(){
      root.querySelectorAll('.fund-del-btn').forEach(b=>{
        b.addEventListener('click', ()=>{
          const id = b.dataset.id;
          confirmAction('確定要刪除這筆資金紀錄嗎？', ()=>{
            state.fundLogs = state.fundLogs.filter(f=>f.id!==id);
            saveState();
            render();
            openFundLogModal(selectedAccount);
          });
        });
      });
    }
    bindDeleteButtons();

    const realAccSel = fixedAccount ? null : root.querySelector('.modal-body select');
    if(realAccSel){
      realAccSel.addEventListener('change', ()=>{
        selectedAccount = realAccSel.value;
        root.querySelector('#fundHistoryWrap').innerHTML = historyHtml(selectedAccount);
        bindDeleteButtons();
      });
    }

    root.querySelector('#fundLogForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const accountId = fixedAccount || selectedAccount;
      if(!accountId){ stampToast('請先新增帳戶', true); return; }
      const date = root.querySelector('#fundDate').value;
      const ownAmount = parseFloat(root.querySelector('#fundOwn').value)||0;
      const marginAmount = parseFloat(root.querySelector('#fundMargin').value)||0;
      const note = root.querySelector('#fundNote').value.trim();
      state.fundLogs.push({id:uid(), accountId, date, ownAmount, marginAmount, note});
      saveState();
      closeModal();
      render();
    });
  });
}

/* ============================= MODALS: REPAYMENT LOG ============================= */
function openRepaymentModal(editId){
  const editing = editId ? state.repaymentLogs.find(r=>r.id===editId) : null;
  const fixedAccount = activeIsAll() ? null : state.activeAccountId;
  let selectedAccount = editing ? editing.accountId : (fixedAccount || (state.accounts[0] && state.accounts[0].id));

  const body = `
  <form id="repayForm">
    ${fixedAccount?'':`<div class="form-row"><label>帳戶</label>${accountSelectHtml(selectedAccount)}</div>`}
    <div class="form-row"><label>還款日期</label><input type="date" id="repayDate" value="${editing?editing.date:todayStr()}" required></div>
    <div class="form-row"><label>還款金額</label><input type="number" step="1" min="0" id="repayAmount" value="${editing?editing.amount:''}" required></div>
    <div class="form-row"><label>備註</label><input type="text" id="repayNote" placeholder="選填，例如本期本金＋利息" value="${editing?esc(editing.note||''):''}"></div>
    <div class="modal-actions">
      ${editing?`<button type="button" class="btn-danger" id="repayDeleteBtn" style="margin-right:auto;">刪除</button>`:''}
      <button type="button" class="btn-secondary" data-action="close-modal">取消</button>
      <button type="submit" class="btn-stamp">${editing?'儲存變更':'新增還款紀錄'}</button>
    </div>
  </form>`;

  openModal(editing?'編輯還款紀錄':'新增還款紀錄', body, (root)=>{
    root.querySelector('#repayForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const accountId = fixedAccount || root.querySelector('.modal-body select').value;
      if(!accountId){ stampToast('請先新增帳戶', true); return; }
      const date = root.querySelector('#repayDate').value;
      const amount = Math.abs(parseFloat(root.querySelector('#repayAmount').value)||0);
      const note = root.querySelector('#repayNote').value.trim();
      if(amount<=0){ stampToast('請輸入還款金額', true); return; }
      if(editing){
        Object.assign(editing, {accountId, date, amount, note});
      } else {
        state.repaymentLogs.push({id:uid(), accountId, date, amount, note});
      }
      saveState();
      closeModal();
      currentTab = 'repayment';
      render();
    });
    if(editing){
      root.querySelector('#repayDeleteBtn').addEventListener('click', ()=>{
        closeModal();
        confirmAction('確定要刪除這筆還款紀錄嗎？', ()=>{
          state.repaymentLogs = state.repaymentLogs.filter(r=>r.id!==editing.id);
          saveState();
          render();
        });
      });
    }
  });
}

/* ============================= IMPORT / EXPORT ============================= */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `股票紀錄備份_${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  stampToast('已匯出備份檔');
}
function importData(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      confirmAction('匯入將覆蓋目前所有資料，確定要繼續嗎？', ()=>{
        state = Object.assign(defaultState(), parsed);
        saveState(false);
        stampToast('匯入成功');
        render();
      });
    }catch(err){
      stampToast('檔案格式錯誤，匯入失敗', true);
    }
  };
  reader.readAsText(file);
}

/* ============================= EVENT DELEGATION ============================= */
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  switch(action){
    case 'close-modal': closeModal(); break;
    case 'switch-account':
      state.activeAccountId = btn.dataset.id;
      saveState(false);
      render();
      break;
    case 'add-account': openAccountModal(); break;
    case 'edit-account': openAccountModal(btn.dataset.id); break;
    case 'open-buy': openTransactionModal({action:'buy'}); break;
    case 'open-sell': openTransactionModal({action:'sell', accountId:btn.dataset.accid, symbol:btn.dataset.symbol}); break;
    case 'open-sell-generic': openTransactionModal({action:'sell'}); break;
    case 'edit-transaction': openTransactionModal({editId:btn.dataset.id}); break;
    case 'delete-transaction':
      confirmAction('確定要刪除這筆交易紀錄嗎？', ()=>{
        state.transactions = state.transactions.filter(t=>t.id!==btn.dataset.id);
        saveState(); render();
      });
      break;
    case 'open-dividend': openDividendModal(); break;
    case 'edit-dividend': openDividendModal(btn.dataset.id); break;
    case 'delete-dividend':
      confirmAction('確定要刪除這筆配息紀錄嗎？', ()=>{
        state.dividends = state.dividends.filter(d=>d.id!==btn.dataset.id);
        saveState(); render();
      });
      break;
    case 'open-repayment': openRepaymentModal(); break;
    case 'edit-repayment': openRepaymentModal(btn.dataset.id); break;
    case 'delete-repayment':
      confirmAction('確定要刪除這筆還款紀錄嗎？', ()=>{
        state.repaymentLogs = state.repaymentLogs.filter(r=>r.id!==btn.dataset.id);
        saveState(); render();
      });
      break;
    case 'edit-meta': openMetaModal(btn.dataset.accid, btn.dataset.symbol); break;
    case 'update-price': openPriceModal(btn.dataset.symbol); break;
    case 'bulk-update-holdings-prices':
      bulkFetchTodayPrices();
      break;
    case 'open-price-log': openPriceModal(); break;
    case 'open-fundlog': openFundLogModal(); break;
    case 'open-daily-log': openDailyLogModal({type:btn.dataset.type}); break;
    case 'edit-daily-log': openDailyLogModal({editId:btn.dataset.id}); break;
    case 'delete-daily-log':
      confirmAction('確定要刪除這筆每日賺賠紀錄嗎？', ()=>{
        state.dailyPLLogs = state.dailyPLLogs.filter(l=>l.id!==btn.dataset.id);
        saveState(); render();
      });
      break;
    case 'open-sync': openSyncModal(); break;
    case 'export-data': exportData(); break;
    case 'trigger-import': document.getElementById('fileImport').click(); break;
    case 'clear-local':
      confirmAction(
        syncCode
          ? '確定要清除這台裝置的本機資料嗎？清除後會自動從雲端重新下載最新資料，不會影響雲端或其他裝置上的資料。'
          : '確定要清除本機資料嗎？此動作無法復原，建議先匯出備份。',
        ()=>{
          localStorage.removeItem(STORAGE_KEY);
          state = defaultState();
          render();
          if(syncCode){
            stampToast('本機已清除，正在從雲端重新下載…');
            pullFromCloudOnce().then((ok)=>{
              render();
              stampToast(ok ? '已從雲端還原資料' : '雲端目前也沒有資料');
            });
          } else {
            stampToast('本機資料已清除');
          }
        }
      );
      break;
    case 'clear-all':
      confirmAction(
        syncCode
          ? '確定要清除所有資料嗎？這會同時清除雲端與所有已同步裝置上的資料，且無法復原！建議先匯出備份。'
          : '確定要清除所有資料嗎？此動作無法復原，建議先匯出備份。',
        ()=>{
          state = defaultState();
          saveState(false);
          stampToast('資料已清除');
          render();
        }
      );
      break;
  }
});
document.getElementById('sectionTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  renderSectionTabs();
  renderPanel();
});
document.getElementById('fileImport').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) importData(file);
  e.target.value = '';
});

/* ============================= INIT ============================= */
render();
if(syncCode) startSync(syncCode);

})();
</script>
</body>
</html>
